<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="848" height="138" rx="8" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Accent Top Line -->
  <rect x="2" y="2" width="846" height="3" rx="1.5" fill="url(#lineGrad)" />

  <!-- Main Name -->
  <text x="35" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f0f6fc" letter-spacing="1">
    YEAMIN SHEIKH
  </text>

  <!-- Subtitle -->
  <text x="35" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e">
    Systems developer and automation builder based in Bangladesh
  </text>

  <!-- Spec Pills / Breadcrumbs -->
  <g transform="translate(35, 105)" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#38bdf8">
    <text x="0" y="10">Python</text>
    <text x="60" y="10" fill="#484f58">•</text>
    <text x="80" y="10">TypeScript</text>
    <text x="170" y="10" fill="#484f58">•</text>
    <text x="190" y="10">C#</text>
    <text x="220" y="10" fill="#484f58">•</text>
    <text x="240" y="10">PowerShell</text>
    <text x="335" y="10" fill="#484f58">•</text>
    <text x="355" y="10">FFmpeg</text>
    <text x="425" y="10" fill="#484f58">•</text>
    <text x="445" y="10">Playwright</text>
  </g>

  <!-- Status Indicator -->
  <g transform="translate(730, 42)">
    <circle cx="0" cy="0" r="4" fill="#3fb950" />
    <text x="12" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Active</text>
  </g>
</svg>
